[package]
name = "capability-ladder"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Audit delegated capability chains for privilege amplification and context drift"
license = "MIT"
repository = "https://github.com/nicholas-ruest/capability-ladder"
keywords = ["security", "authorization", "agents", "cli", "delegation"]
categories = ["command-line-utilities", "authentication"]

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.23"

[profile.release]
lto = "thin"
strip = true
